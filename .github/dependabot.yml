# Dependabot — weekly dependency updates, grouped so one PR covers the
# toolchain rather than twelve separate ones. @rexezuge/* updates land in
# their own group, which is the kit's upgrade path: a bump PR per repo, and
# the repo's own CI is the gate.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      kit:
        patterns:
          - '@rexezuge/*'
      toolchain:
        patterns:
          - 'typescript'
          - 'vitest'
          - 'vite'
          - 'eslint'
          - 'typescript-eslint'
          - 'prettier'
          - 'wrangler'
      cloudflare:
        patterns:
          - '@cloudflare/*'
