# Scheduled Version Update — stamp .github/.version twice a month.
#
# The stamp is the family's cache-buster: the CD workflow reads it, and the
# backup workflows use it in branch names. Forked repos skip the schedule
# (`if: !github.event.repository.fork`) because a fork must not race its
# upstream's push.

name: Scheduled Version Update

on:
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  contents: write

jobs:
  update-version:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Write Current Unix Timestamp
        run: date +%s > .github/.version

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/.version
          git diff --staged --quiet || git commit -m "CHORE: Version Update"
          git push
